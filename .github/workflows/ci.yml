name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Supply-chain (B11-6): restore in LOCKED mode against the committed packages.lock.json
      # files. --locked-mode fails if the resolved graph differs from the lockfile, so a
      # dependency change can't slip in without updating the (reviewed) lockfile. The MAUI
      # shells are excluded (not built in CI, no committed lockfile).
      - name: Restore (locked mode)
        run: |
          dotnet restore src/Api/Perezosoft.Api.csproj --locked-mode
          dotnet restore src/Web/Perezosoft.Web.csproj --locked-mode
          dotnet restore tests/E2E.Tests/Perezosoft.E2E.Tests.csproj --locked-mode
          dotnet restore tests/Core.Tests/Perezosoft.Core.Tests.csproj --locked-mode
          dotnet restore tests/Api.Tests/Perezosoft.Api.Tests.csproj --locked-mode

      # Build the Linux-buildable graph with warnings-as-errors (Directory.Build.props).
      # The MAUI shells target net10.0-windows / -android and are excluded here; they're
      # deferred and not part of the gate. Building Web covers Shared.Ui (the RCL).
      # --no-restore: reuse the locked-mode restore above (don't let the build re-restore loosely).
      - name: Build (warnings-as-errors)
        run: |
          dotnet build src/Api/Perezosoft.Api.csproj -c Release --no-restore
          dotnet build src/Web/Perezosoft.Web.csproj -c Release --no-restore
          dotnet build tests/E2E.Tests/Perezosoft.E2E.Tests.csproj -c Release --no-restore

      # Unit + integration tests. Api.Tests includes the architecture invariants (B9-1) and the
      # migration-drift guard (B6-2); both spin up Postgres via Testcontainers (Docker is
      # available on ubuntu-latest). E2E.Tests need the full running stack and aren't run here.
      # --no-restore: the locked-mode restore already ran.
      - name: Test (Core + Api)
        run: |
          dotnet test tests/Core.Tests/Perezosoft.Core.Tests.csproj -c Release --no-restore
          dotnet test tests/Api.Tests/Perezosoft.Api.Tests.csproj -c Release --no-restore

      # Fail the build if the EF model has drifted from the latest migration/snapshot.
      - name: No pending EF model changes
        # The design-time factory reads the connection string from this key (no .env in CI).
        # has-pending-model-changes compares the model to the snapshot and opens no DB
        # connection, so a placeholder is enough to build the Npgsql model.
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=ef_designtime;Username=ci;Password=ci"
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/Perezosoft.Infrastructure.csproj \
            --startup-project src/Api/Perezosoft.Api.csproj

  # Secret scan (v2 audit B11-5). Runs the gitleaks OSS binary directly (no marketplace action, so no
  # org-license requirement) over the full history + working tree. Config + allowlist in .gitleaks.toml;
  # real secrets live only in the gitignored .env, which is never committed.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the scan covers every commit, not just the tip

      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact --config .gitleaks.toml

  # QA artifacts (v2 audit B11-8). The two printable PDFs (QA_TEST_GUIDE, QA_RUN_LOG) are generated from
  # docs/QA_TEST_PLAN.md; this job regenerates them and fails if the committed PDFs' text has drifted from
  # the plan — i.e. the plan was edited without re-running the generators (plan ⇄ PDFs must change
  # together). reportlab/pypdf are pinned so regeneration matches the committed artifacts.
  qa-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check QA PDFs are in sync with QA_TEST_PLAN.md
        run: |
          python -m pip install --quiet "reportlab==5.0.0" "pypdf==6.14.2"
          cd docs && python check_qa_artifacts.py

  # Dependency license scan (v2 audit B11-6, R26). Inventories every NuGet license in the main app's
  # graph (direct + transitive) and FAILS only on clearly-incompatible copyleft licenses
  # (GPL/AGPL/LGPL/SSPL) — a prohibited-list, not an allow-list, so Microsoft/permissive-OSS
  # licenses (MIT, Apache-2.0, BSD, PostgreSQL, ...) never trip a false positive. Kept a separate
  # job so a license failure is distinguishable from a build/test failure.
  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: dotnet-project-licenses (fail on copyleft)
        # Restore first so project.assets.json exists for the transitive walk (the app uses Central
        # Package Management, so versions resolve from Directory.Packages.props). The tool targets an
        # older runtime, so roll forward to the installed .NET. It prints the full license table and
        # exits non-zero if any license in .github/forbidden-licenses.json (GPL/AGPL/LGPL/SSPL) appears.
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          dotnet restore src/Api/Perezosoft.Api.csproj
          dotnet tool install --global dotnet-project-licenses
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet-project-licenses \
            --input src/Api/Perezosoft.Api.csproj \
            --include-transitive \
            --use-project-assets-json \
            --forbidden-license-types .github/forbidden-licenses.json

  # Production image build gate (DEPLOY-2, ADR-017). The multi-stage Dockerfile (publishes Web + Api and
  # serves the WASM single-origin) must keep building. Build-only — no push, and no run here: the
  # compose-parity smoke (boot + migrate + serve) needs a database and is a local/manual step per
  # docs/DEPLOYMENT.md. This just stops the Dockerfile silently rotting.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the production image
        run: docker build -t perezosoft-app:ci .

  # Native (MAUI) build gate — NATIVE-1 (ADR-018). Compile-only (no emulator, no signing): a change that
  # breaks the native build fails the PR instead of rotting until a manual run. Android + Windows run on
  # every trigger (cheap runners); the Apple targets live in native-build-apple below (macOS = 10× billed
  # minutes on a private repo, so they run on develop pushes only — still catches rot within one merge).
  # The Maui project is outside the locked-mode restore path by design (host-conditional TFMs — see the
  # csproj note); CPM pins its package versions.
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tfm: net10.0-android
            os: ubuntu-latest
          - tfm: net10.0-windows10.0.19041.0
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # The Android target compiles against the JDK; runners preinstall the Android SDK (ANDROID_HOME).
      - uses: actions/setup-java@v4
        if: contains(matrix.tfm, 'android')
        with:
          distribution: temurin
          java-version: "17"

      # workload RESTORE (not install <id>): a multi-TFM project restores EVERY host-visible TFM even
      # when building just one (-f), so each runner needs the workloads for all TFMs its OS exposes —
      # e.g. macOS needs android too (NETSDK1147 otherwise). restore resolves that per-host, forever.
      - name: Install the MAUI workloads (host-aware)
        run: dotnet workload restore src/Maui/Perezosoft.Maui.csproj

      - name: Build (compile-only gate)
        run: dotnet build src/Maui/Perezosoft.Maui.csproj -f ${{ matrix.tfm }} -c Debug -p:AcceptAndroidSDKLicenses=true

  # Relevance gate for the expensive native legs. Born as a free-tier cost guard (the 2026-07-03
  # NATIVE sprint burned a month of private-repo minutes in one day: ~10 develop pushes × [2 macOS
  # legs at 10× + Windows at 2×]); the repo is public now (2026-07-04) so standard-runner minutes
  # are free, but the gate still pays for itself in wall-clock and runner-queue time — and keeps
  # any future return to private billable-safe. This cheap job diffs each develop push; docs-only
  # merges (stories, QA plan/PDFs, parity matrix, ...) skip the Apple builds and both native smokes.
  # Anything that could affect a native binary or the smoke harness (src/**, the E2E project,
  # package pins, this workflow) still runs them. A schedule can't replace this: scheduled
  # workflows execute from the DEFAULT branch (main here, which is deploy-only and behind develop).
  native-paths:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        run: |
          # Unknown before-SHA (force push, branch creation) ⇒ fail open: run the legs.
          if ! git cat-file -e ${{ github.event.before }} 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
              | grep -qE '^(src/|tests/E2E\.Tests/|tests/native-smoke-android/|Directory\.Packages\.props|\.github/workflows/ci\.yml|global\.json)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::docs-only push — skipping the Apple builds and native smokes."
          fi

  # Apple half of the native build gate (NATIVE-1). Develop pushes only, and only when the push
  # touched native-relevant paths (see native-paths): macOS runners bill at 10× on a private repo.
  native-build-apple:
    needs: native-paths
    if: needs.native-paths.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - tfm: net10.0-ios
          - tfm: net10.0-maccatalyst
    # Pinned (not macos-latest): the .NET-for-iOS/macCatalyst workload requires a matching Xcode —
    # 26.5 as of SDK 10.0.301 — and macos-26 is the GA image whose default Xcode is 26.5. The
    # macos-latest label still resolves to an older image (Xcode 16.4) on some rollouts, which fails
    # with "requires Xcode 26.5". Revisit the pin when bumping the .NET SDK.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # See the native-build note: restore installs ALL workloads this host's TFM list needs (on macOS
      # that's ios + maccatalyst + android — the android TFM restores here too, even building -f ios).
      - name: Install the MAUI workloads (host-aware)
        run: dotnet workload restore src/Maui/Perezosoft.Maui.csproj

      - name: Build (compile-only gate)
        run: dotnet build src/Maui/Perezosoft.Maui.csproj -f ${{ matrix.tfm }} -c Debug

  # Native smoke — Windows (NATIVE-7, ADR-018). Runs the REAL MAUI Windows app against a real API +
  # Postgres + Mailpit, and drives its WebView2 over the Chrome DevTools Protocol (Playwright
  # ConnectOverCDP — no Appium): boot → OTP sign-in → an authorized page loads. Develop pushes with
  # native-relevant changes only (see native-paths; Windows bills 2×, job ~10 min). Deliberately NOT
  # in the deploy-staging needs — a flaky native run must not block web deploys (accepted-risk note
  # in ADR-018: native UI automation is flakier than browser E2E; this stays a tiny canary).
  native-smoke-windows:
    needs: native-paths
    if: needs.native-paths.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install the MAUI workloads (host-aware)
        run: dotnet workload restore src/Maui/Perezosoft.Maui.csproj

      - name: Build the app + API + smoke tests
        run: |
          dotnet restore src/Api/Perezosoft.Api.csproj --locked-mode
          dotnet restore tests/E2E.Tests/Perezosoft.E2E.Tests.csproj --locked-mode
          dotnet build src/Api/Perezosoft.Api.csproj -c Debug --no-restore
          dotnet build tests/E2E.Tests/Perezosoft.E2E.Tests.csproj -c Debug --no-restore
          dotnet build src/Maui/Perezosoft.Maui.csproj -f net10.0-windows10.0.19041.0 -c Debug

      - name: Start Postgres (preinstalled) + Mailpit
        # The Windows runner image ships PostgreSQL with its service disabled (creds
        # postgres/root via PGUSER/PGPASSWORD). Mailpit is a single Go binary.
        run: |
          $svc = Get-Service postgresql* | Select-Object -First 1
          if (-not $svc) { Write-Error "no preinstalled PostgreSQL service on this image"; exit 1 }
          Set-Service $svc.Name -StartupType Manual
          Start-Service $svc.Name
          $env:PGPASSWORD = "root"
          & "$env:PGBIN\psql" -U postgres -c "CREATE DATABASE smoke;"
          Invoke-WebRequest -Uri "https://github.com/axllent/mailpit/releases/latest/download/mailpit-windows-amd64.zip" -OutFile mailpit.zip
          Expand-Archive mailpit.zip -DestinationPath mailpit-bin
          Start-Process -FilePath "mailpit-bin\mailpit.exe" -WindowStyle Hidden

      - name: Boot API + app, run the native smoke
        # Everything process-bound lives in ONE step (the runner tears down a step's process tree).
        # The app is pointed at the plain-HTTP API via PEREZOSOFT_API_BASE_URL (no dev-cert hoops) and
        # launched with WebView2 remote debugging for the CDP connection.
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=smoke;Username=postgres;Password=root"
          Jwt__Secret: "ci-native-smoke-jwt-signing-key-0123"
          PEREZOSOFT_API_BASE_URL: "http://localhost:5238"
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: "--remote-debugging-port=9223"
          NATIVE_SMOKE_CDP: "http://localhost:9223"
          MAILPIT_BASE_URL: "http://localhost:8025"
        run: |
          $api = Start-Process dotnet -ArgumentList "run --project src/Api/Perezosoft.Api.csproj -c Debug --no-build --urls http://localhost:5238" -PassThru -RedirectStandardOutput api.log -RedirectStandardError api.err.log

          Write-Host "Waiting for the API..."
          $ready = $false
          foreach ($i in 1..60) {
            try { if ((Invoke-WebRequest -Uri "http://localhost:5238/health/ready" -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $ready = $true; break } } catch {}
            Start-Sleep -Seconds 3
          }
          if (-not $ready) { Write-Host "::error::API did not become ready"; Get-Content api.log -Tail 60; exit 1 }

          $exe = "src/Maui/bin/Debug/net10.0-windows10.0.19041.0/win-x64/Perezosoft.Maui.exe"
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem -Recurse -Path src/Maui/bin -Filter Perezosoft.Maui.exe | Select-Object -First 1 -ExpandProperty FullName }
          Start-Process -FilePath $exe

          Write-Host "Waiting for the WebView2 CDP endpoint..."
          $cdp = $false
          foreach ($i in 1..40) {
            try { if ((Invoke-WebRequest -Uri "http://localhost:9223/json/version" -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $cdp = $true; break } } catch {}
            Start-Sleep -Seconds 3
          }
          if (-not $cdp) { Write-Host "::error::CDP endpoint never came up (WebView2 runtime missing, or the app crashed at boot)"; Get-Content api.log -Tail 40; exit 1 }

          dotnet test tests/E2E.Tests/Perezosoft.E2E.Tests.csproj -c Debug --no-build --filter "Category=NativeSmoke"

      - name: API log (on failure)
        if: failure()
        run: if (Test-Path api.log) { Get-Content api.log -Tail 100 }

  # Native smoke — Android (NATIVE-7, ADR-018). Same canary as the Windows leg, on a real emulator.
  # Android WebView's CDP lacks the browser-context management Playwright's ConnectOverCDP needs, so
  # this leg uses playwright-core's Node-only _android module (adb + WebView attach) — the tiny spec
  # lives in tests/native-smoke-android/. The emulator is hand-rolled from the runner's preinstalled
  # SDK (no marketplace action, mirroring the gitleaks approach). Two hard-won gotchas encoded here:
  # the app must be built with EmbedAssembliesIntoApk=true (a fast-deployment Debug APK silently
  # fails to start from a plain `adb install`), and the WebView devtools socket only exists after
  # the app process is up.
  native-smoke-android:
    needs: native-paths
    if: needs.native-paths.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: smoke
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smoke -d smoke" --health-interval 5s --health-timeout 5s --health-retries 15
      mail:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the MAUI workloads (host-aware)
        run: dotnet workload restore src/Maui/Perezosoft.Maui.csproj

      - name: Build the app (self-contained APK) + API + smoke deps
        run: |
          dotnet build src/Maui/Perezosoft.Maui.csproj -f net10.0-android -c Debug \
            -p:AcceptAndroidSDKLicenses=true -p:EmbedAssembliesIntoApk=true
          dotnet restore src/Api/Perezosoft.Api.csproj --locked-mode
          dotnet build src/Api/Perezosoft.Api.csproj -c Debug --no-restore
          npm ci --prefix tests/native-smoke-android

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create and boot the emulator
        # Every phase is bounded and narrated — the first CI run hung silently for 30+ minutes to
        # the job timeout (a timed-out job's logs aren't even archived), so nothing here may block
        # without a deadline: downloads get `timeout`, and the adb waits poll WITH an emulator
        # process liveness check instead of the unbounded `adb wait-for-device`.
        run: |
          set -e
          SDK="$ANDROID_HOME"
          echo "::group::sdkmanager (licenses + system image)"
          yes | timeout 120 "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          timeout 900 "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-34;google_apis;x86_64" "emulator" "platform-tools"
          echo "::endgroup::"

          # avdmanager and the emulator resolve the AVD directory DIFFERENTLY unless it's pinned:
          # run 3 failed with "Unknown AVD name [smoke]" — avdmanager wrote the AVD where the
          # emulator doesn't look. One exported ANDROID_AVD_HOME makes both sides agree (it's also
          # what the reactivecircus emulator action does), and -list-avds verifies before launch.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          echo "creating AVD…"
          echo no | timeout 120 "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n smoke -k "system-images;android-34;google_apis;x86_64" --force
          "$SDK/emulator/emulator" -list-avds | grep -qx smoke || {
            echo "::error::the AVD is not visible to the emulator"; ls -la "$ANDROID_AVD_HOME" || true; exit 1; }

          echo "launching emulator…"
          nohup "$SDK/emulator/emulator" -avd smoke -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          EMU_PID=$!
          echo "emulator pid $EMU_PID"

          echo "waiting for the device + Android boot…"
          booted=0
          for i in $(seq 1 96); do   # up to 8 min, 5s ticks
            kill -0 "$EMU_PID" 2>/dev/null || { echo "::error::the emulator process died"; tail -60 emulator.log; exit 1; }
            boot=$("$SDK/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$boot" = "1" ] && { booted=1; echo "emulator booted after ~$((i*5))s"; break; }
            [ $((i % 6)) -eq 0 ] && echo "  still booting (~$((i*5))s)…"
            sleep 5
          done
          [ "$booted" = "1" ] || { echo "::error::emulator did not finish booting in 8 min"; tail -60 emulator.log; exit 1; }

      - name: Boot API + app, run the Android smoke
        # One step for everything process-bound (the runner tears down a step's process tree).
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=smoke;Username=smoke;Password=smoke"
          Jwt__Secret: "ci-native-smoke-jwt-signing-key-0123"
          MAILPIT_BASE_URL: "http://localhost:8025"
        run: |
          set -e
          # platform-tools was installed by sdkmanager this job — it is NOT on the runner's PATH
          # (run 4 died with `adb: command not found`); the Node smoke needs adb reachable too.
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          dotnet run --project src/Api/Perezosoft.Api.csproj -c Debug --no-build --urls http://localhost:5238 > api.log 2>&1 &

          echo "Waiting for the API…"
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5238/health/ready || echo 000)
            [ "$api" = "200" ] && { echo "ready"; break; }
            sleep 3
          done
          [ "$api" = "200" ] || { echo "::error::API did not become ready"; tail -60 api.log; exit 1; }

          adb install -r src/Maui/bin/Debug/net10.0-android/com.perezosoft.platform-Signed.apk
          # The app's compiled Android base URL is http://localhost:5238 — adb reverse maps the
          # emulator's localhost:5238 back to this runner (same trick as local dev).
          adb reverse tcp:5238 tcp:5238
          adb shell monkey -p com.perezosoft.platform -c android.intent.category.LAUNCHER 1

          echo "Waiting for the app process…"
          for i in $(seq 1 20); do
            pid=$(adb shell pidof com.perezosoft.platform | tr -d '\r')
            [ -n "$pid" ] && { echo "app pid $pid"; break; }
            sleep 3
          done
          [ -n "$pid" ] || { echo "::error::the app never started (fast-deployment APK? startup crash?)"; adb logcat -d | grep -iE "companyname|FATAL" | tail -40; exit 1; }

          node tests/native-smoke-android/smoke.js

      - name: Logs (diagnostics)
        # always(), not failure(): a job TIMEOUT cancels remaining steps, and cancelled steps
        # don't satisfy failure() — the first hung run produced zero diagnostics because of this.
        if: always()
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          tail -n 40 emulator.log || true
          tail -n 60 api.log || true
          adb logcat -d 2>/dev/null | grep -iE "companyname|FATAL|blazor" | tail -n 60 || true

  # End-to-end tests (v2 audit B8-5). Boots the REAL stack — Postgres + Mailpit (service containers) +
  # the API + the Blazor WASM Web app — and drives a headless Chromium through the QA smoke journeys,
  # reading OTP codes from Mailpit (the same trick a manual tester uses). Everything runs on plain HTTP
  # (Development skips the HTTPS redirect) so there are no dev-cert hoops; the WASM client is pointed at
  # the HTTP API, and appsettings.Development already allow-lists the Web origin for CORS + Mailpit SMTP.
  # OAuth/desktop/Android stay manual (they need an external provider / native runners).
  e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: e2e
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U e2e -d e2e" --health-interval 5s --health-timeout 5s --health-retries 15
      mail:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Point the WASM client at the HTTP API
        # The committed wwwroot/appsettings.json targets the dev https API; the CI stack is http.
        run: |
          echo '{ "ApiBaseUrl": "http://localhost:5238" }' > src/Web/wwwroot/appsettings.json

      - name: Restore (locked mode)
        run: |
          dotnet restore src/Api/Perezosoft.Api.csproj --locked-mode
          dotnet restore src/Web/Perezosoft.Web.csproj --locked-mode
          dotnet restore tests/E2E.Tests/Perezosoft.E2E.Tests.csproj --locked-mode

      - name: Build API + Web + E2E
        run: |
          dotnet build src/Api/Perezosoft.Api.csproj -c Debug --no-restore
          dotnet build src/Web/Perezosoft.Web.csproj -c Debug --no-restore
          dotnet build tests/E2E.Tests/Perezosoft.E2E.Tests.csproj -c Debug --no-restore

      - name: Install Chromium (Playwright)
        run: pwsh tests/E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Boot the stack + run E2E
        # Servers must be started in the SAME step as the test run — GitHub tears down a step's process
        # tree when the step ends. Start API + Web in the background, wait for readiness, then test.
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=e2e;Username=e2e;Password=e2e"
          Jwt__Secret: "ci-e2e-jwt-signing-secret-0123456789ab"
          # The whole browser suite shares one source IP, so raise the per-IP passwordless limit well
          # above the prod default of 5 (the limiter itself is unit-tested at the default in Api.Tests).
          Auth__RateLimit__PasswordlessPermitLimit: "1000"
          # Staff allowlist for the admin-console E2E journey (ADMIN-3) — must match
          # AnnouncementJourneyTests.StaffEmail.
          Admin__StaffEmails__0: "e2e-staff@example.com"
          # Where server-side redirects send the BROWSER (magic-link verify, OAuth callback → the client).
          # Without this it falls back to the dev default https://localhost:7008, which is NOT running in
          # this stack — so the magic-link journey (E2E-4) died with ERR_CONNECTION_REFUSED (Playwright
          # attributes the refusal to the *requested* URL, which made it look like the API was down).
          Auth__AppBaseUrl: "http://localhost:5169"
        run: |
          set -e
          dotnet run --project src/Api/Perezosoft.Api.csproj -c Debug --no-build --urls http://localhost:5238 > api.log 2>&1 &
          dotnet run --project src/Web/Perezosoft.Web.csproj -c Debug --no-build --urls http://localhost:5169 > web.log 2>&1 &

          echo "Waiting for API + Web…"
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5238/health/ready || echo 000)
            web=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5169/ || echo 000)
            [ "$api" = "200" ] && [ "$web" = "200" ] && { echo "ready"; break; }
            sleep 3
          done
          [ "$api" = "200" ] && [ "$web" = "200" ] || { echo "::error::stack did not become ready"; tail -40 api.log web.log; exit 1; }

          PLAYWRIGHT_BASE_URL=http://localhost:5169 MAILPIT_BASE_URL=http://localhost:8025 \
            E2E_API_BASE_URL=http://localhost:5238 \
            dotnet test tests/E2E.Tests/Perezosoft.E2E.Tests.csproj -c Debug --no-build

      - name: Server logs (on failure)
        if: failure()
        # -n 80 (not -80): the numeric shorthand is invalid with multiple files in GNU tail, which made
        # this diagnostic silently print nothing on every failure.
        run: tail -n 80 api.log web.log || true

  # Deploy staging (DEPLOY-3, ADR-017). Runs ONLY on a push to develop, and only after every test/build
  # gate above is green — so staging always reflects a passing develop. Triggers the Render deploy via a
  # deploy hook (repo secret), then polls the public URL and smoke-tests it. Both the hook and the base
  # URL are optional: absent ⇒ the job logs a notice and passes, so the template is green out of the box
  # and a downstream app opts in by adding the secret + variable (see docs/DEPLOYMENT.md).
  deploy-staging:
    needs: [build-test, secret-scan, qa-artifacts, license-scan, docker-build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    # Back-to-back merges: Render supersedes the older build, so the older run's version-gated smoke
    # can never see its own SHA go live and fails spuriously. Cancel the older in-flight deploy job
    # instead — cancelled reads as neutral, and the newest push still gets its full smoke.
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_STAGING not set — skipping staging deploy. Add the secret to enable."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Triggered Render staging deploy."

      - name: Wait for staging + smoke test
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
          BASE: ${{ vars.STAGING_BASE_URL }}
          EXPECT: ${{ github.sha }}
        run: |
          if [ -z "$HOOK" ] || [ -z "$BASE" ]; then
            echo "::notice::Deploy hook or STAGING_BASE_URL not set — skipping post-deploy smoke."
            exit 0
          fi
          # Wait for the NEW build to actually be live — the old instance keeps serving during Render's
          # build, so poll /api/version until it reports this commit AND readiness is 200. (Free-tier
          # build + cold boot can take several minutes.)
          echo "Waiting for $BASE to report commit $EXPECT …"
          ready=0
          for i in $(seq 1 50); do
            got=$(curl -s -m 20 "$BASE/api/version" | jq -r '.commit // empty' 2>/dev/null || echo "")
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$BASE/health/ready" || echo 000)
            if [ "$got" = "$EXPECT" ] && [ "$code" = "200" ]; then ready=1; echo "  new build live after ~$((i*15))s"; break; fi
            echo "  [$i] version=${got:-none} ready=$code; retry in 15s"
            sleep 15
          done
          [ "$ready" = "1" ] || { echo "::error::the new build did not go live in time (version never matched $EXPECT)"; exit 1; }

          fail=0
          assert() { # label expected url
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$3")
            if [ "$code" = "$2" ]; then echo "PASS  $1  ($3 → $code)"
            else echo "::error::FAIL $1 ($3 → $code, want $2)"; fail=1; fi
          }
          assert liveness         200 "$BASE/health"
          assert readiness        200 "$BASE/health/ready"
          assert build-version    200 "$BASE/api/version"
          assert spa-shell        200 "$BASE/"
          assert spa-deeplink     200 "$BASE/settings"
          assert api-not-shadowed 404 "$BASE/api/does-not-exist"
          assert providers        200 "$BASE/api/auth/providers"
          exit $fail

  # Deploy prod (DEPLOY-3). Runs ONLY on a push to main, behind the `production` GitHub Environment — add a
  # required reviewer to that environment (repo Settings → Environments) to make prod a manual approval, so
  # main stays deploy-only + deliberate. Skips cleanly until a prod service + its deploy hook exist.
  deploy-prod:
    needs: [build-test, secret-scan, qa-artifacts, license-scan, docker-build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render prod deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_PROD not set — no prod service yet. Skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Triggered Render prod deploy."
